<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Evidence wall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;width:390px;height:844px;overflow:hidden;background:#0b1b30;color:#e8eef5;font-family:'IBM Plex Sans',sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(220,233,247,.35)}
.brand{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed';font-weight:700;font-size:22px;text-transform:uppercase}.mk{width:24px;height:24px;background:#e8590c}
.tog{display:flex;border:1.5px solid #dce9f7;font-size:13px;font-weight:600}.tog span{padding:8px 10px}.tog .on{background:#dce9f7;color:#0b1b30}
.head{padding:14px 16px 4px}.head b{font-size:15px}.head h1{margin:6px 0 0;font-family:'Barlow Condensed';font-size:38px;line-height:.95}
.row{padding:12px 0 4px 16px}
.rh{display:flex;justify-content:space-between;align-items:baseline;padding-right:16px}
.rh b{font-size:16px}.rh span{font:500 15px 'IBM Plex Mono'}
.tiles{display:flex;gap:8px;margin-top:8px;overflow:hidden}
.t{flex:0 0 112px;height:84px;background:#0f2a4f;position:relative;border:1px solid rgba(220,233,247,.3)}
.t i{position:absolute;left:30px;top:14px;width:50px;height:56px;background:#2b4e7e;outline:3px solid #e8590c;outline-offset:2px}
.t.big{flex-basis:150px;height:110px}.t.big i{left:42px;top:18px;width:64px;height:72px}
.e{background:repeating-linear-gradient(45deg,rgba(220,233,247,.25) 0 1.5px,#0b1b30 1.5px 8px);border:2px dashed #b8c7d8}
.e span{position:absolute;inset:auto 6px 6px 6px;font:12px 'IBM Plex Mono';color:#dce9f7}
.sh{color:#ff9a5c}.ns{color:#b8c7d8}
.req{margin:8px 16px 0;padding:10px 12px;background:#163a6b;font:600 20px/1.1 'Barlow Condensed'}
</style></head><body>
<div class="top"><div class="brand"><span class="mk"></span>SiteProof</div><div class="tog"><span>Builder</span><span class="on">Buyer / bank</span></div></div>
<div class="head"><b>Flat 302 · Stage 6 · Windows</b><h1>9 of 12 windows, each one shown</h1></div>
<div class="row"><div class="rh"><b>Living Room</b><span>3 / 3</span></div>
 <div class="tiles"><div class="t big"><i></i></div><div class="t"><i></i></div><div class="t"><i></i></div></div></div>
<div class="row"><div class="rh"><b>Bedroom 2</b><span class="sh">2 / 4 · Short</span></div>
 <div class="tiles"><div class="t"><i></i></div><div class="t"><i></i></div><div class="t e"><span>not found</span></div><div class="t e"><span>not found</span></div></div></div>
<div class="row"><div class="rh"><b>Kitchen</b><span class="ns">– / 1 · Not seen yet</span></div>
 <div class="tiles"><div class="t e"><span>not filmed</span></div></div></div>
<div class="req">Need 5 s of Flat 302 kitchen, east wall</div>
<div class="row"><div class="rh"><b>Bedroom 1</b><span>2 / 2</span></div>
 <div class="tiles"><div class="t"><i></i></div><div class="t"><i></i></div></div></div>
</body></html>
